		.header {

		.decorative-line {
			width: 50px;
			height: 1px;

			display: inline-block;
			padding: 10px 0;

			text-decoration: none;

			border-bottom: 1px solid #ddd;
			transition: all 0.3s ease;
			margin-bottom: 40px;
		}
		
		.back-link:hover {
			color: #000;
			border-bottom-color: #333;
		}
		
		.classmate-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
			gap: 30px;
			margin: 40px 0;
		}
		
		.classmate-card {
			background: #fff;
			border: 1px solid #eee;
			text-align: center;
			animation: fadeIn 0.8s ease-out both;
		}
		
		.classmate-card:hover {
			border-color: #ccc;
		}
		
		.classmate-card img {
			width: 100%;
			height: 180px;
			object-fit: cover;
			display: block;
		}
		
		.classmate-name {
			padding: 15px 10px;
			background: #fff;
			font-family: 'KaiTi', '楷体', serif;
			font-size: 1rem;
			color: #333;
			font-weight: 400;
			border-top: 1px solid #f0f0f0;
		}
		
		.special-section {
			margin: 60px 0;
			padding: 40px;
			background: #fafafa;
			text-align: center;
			border: 1px solid #eee;
		}
		
		.video-container {
			margin: 30px 0;
			text-align: center;
		}
		
		video {
			max-width: 100%;
			height: auto;
			border: 1px solid #eee;
		}
		
		.birthday-section {
			margin: 40px 0;
			text-align: center;
		}
		
		.birthday-images {
			display: flex;
			justify-content: center;
			gap: 20px;
			flex-wrap: wrap;
			margin-top: 20px;
		}
		
		.birthday-images img {
			max-width: 300px;
			height: auto;
			border: 1px solid #eee;
			cursor: pointer;
		}
		
		.birthday-images img:hover {

		}
		
		.date-info {
			margin: 40px 0;
			padding: 30px;
			background: #fafafa;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 20px;
			text-align: center;
			border: 1px solid #eee;
		}
		
		.date-item h3 {
			color: #333;
			margin-bottom: 10px;
			font-size: 1rem;
			font-weight: 400;
		}
		
		.date-item p {

			font-size: 0.9rem;
		}
		
		/* 响应式设计 */
		@media (max-width: 768px) {
			.container {
				width: 98%;
				padding: 0;
			}
			
			h1 {
				font-size: 1.8rem;
			}
			
			.classmate-grid {

			}
			
			.classmate-card img {

			}

		<script>
			// 图片点击放大功能
			document.addEventListener('DOMContentLoaded', function() {
				const images = document.querySelectorAll('.classmate-card img, .birthday-images img');
				
				images.forEach(img => {
					img.style.cursor = 'pointer';
					img.addEventListener('click', function() {
						const modal = document.createElement('div');
						modal.style.cssText = `
							position: fixed;
							top: 0;
							left: 0;
							width: 100%;
							height: 100%;
							background: rgba(255, 255, 255, 0.95);
							display: flex;
							justify-content: center;
							align-items: center;
							z-index: 1000;
							cursor: pointer;
						`;
						
						const modalImg = document.createElement('img');
						modalImg.src = this.src;
						modalImg.alt = this.alt;
						modalImg.style.cssText = `
							max-width: 90%;
							max-height: 90%;
							object-fit: contain;
							border: 1px solid #eee;
						`;
						
						modal.appendChild(modalImg);
						document.body.appendChild(modal);
						
						modal.addEventListener('click', function() {
							document.body.removeChild(modal);
						});
					});
				});
				
				// 图片加载失败处理
				const allImages = document.querySelectorAll('img');
				allImages.forEach(img => {
					img.addEventListener('error', function() {
						this.style.display = 'none';
					});
				});
			});
